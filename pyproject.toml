[project]
name = "leadleboard"
version = "0.1.0"
description = "Weekly Discord high score collector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "fire>=0.7.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.1",
]

[project.scripts]
leadleboard = "leadleboard.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["smoke: read-only tests against the configured Discord server"]
filterwarnings = ["ignore:'count' is passed as positional argument:DeprecationWarning:discord"]

[tool.ty.src]
exclude = [".venv", ".data"]

[tool.ty.terminal]
error-on-warning = true
