[project]
name = "dle-bot"
version = "0.1.0"
description = "Weekly Discord high score collector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.6.4",
    "fire>=0.7.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
]

[project.scripts]
dle-bot = "dle_bot.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.6",
    "ty>=0.0.31",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
